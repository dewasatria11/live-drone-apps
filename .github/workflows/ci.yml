name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows-ci:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.130

      - name: Restore and verify MediaMTX Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/diagnostics | Out-Null
          Start-Transcript -Path artifacts/diagnostics/dependency-verification.log
          try {
            ./eng/fetch-mediamtx.ps1 -RuntimeIdentifier win-x64
            ./eng/verify-vendor.ps1 -RuntimeIdentifier win-x64
          } finally { Stop-Transcript }

      - name: Require FFmpeg 8.0.1 test tooling
        shell: pwsh
        run: |
          choco install ffmpeg --version=8.0.1 --allow-downgrade --yes --no-progress
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ((ffmpeg -version | Select-Object -First 1) -match '^ffmpeg version 8\.0\.1')) { throw 'FFmpeg test tooling bukan versi 8.0.1.' }
          if (-not ((ffprobe -version | Select-Object -First 1) -match '^ffprobe version 8\.0\.1')) { throw 'FFprobe test tooling bukan versi 8.0.1.' }

      - name: Restore solution
        run: dotnet restore AlIkhsanMedia.Drone.sln

      - name: Build Release including WPF
        run: dotnet build AlIkhsanMedia.Drone.sln --configuration Release --no-restore -bl:artifacts/diagnostics/ci-build.binlog

      - name: Run all Windows unit, contract, and integration tests
        run: dotnet test AlIkhsanMedia.Drone.sln --configuration Release --no-build --logger "trx;LogFilePrefix=ci-windows" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ci-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/diagnostics/**
            **/runtime/*.log
