name: Windows Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag SemVer, contoh v0.1.0-alpha.1'
        required: true
        default: 'v0.1.0-alpha.1'
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and enforce release version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { '${{ inputs.version }}' }
          $release = ./eng/assert-release-version.ps1 -Version $tag
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($release.IsPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.130

      - name: Restore and verify MediaMTX Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/diagnostics | Out-Null
          Start-Transcript -Path artifacts/diagnostics/dependency-verification.log
          try {
            ./eng/fetch-mediamtx.ps1 -RuntimeIdentifier win-x64
            ./eng/verify-vendor.ps1 -RuntimeIdentifier win-x64
          } finally { Stop-Transcript }

      - name: Require pinned build and test tools
        shell: pwsh
        run: |
          choco install ffmpeg --version=8.0.1 --allow-downgrade --yes --no-progress
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ((ffmpeg -version | Select-Object -First 1) -match '^ffmpeg version 8\.0\.1')) { throw 'FFmpeg test tooling bukan versi 8.0.1.' }
          $iscc = @((Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue), "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup tidak ditemukan.' }
          $isccVersion = (& $iscc '/?' 2>&1) -join "`n"
          if ($isccVersion -notmatch '(?m)\b6\.7\.1\b') { throw "Inno Setup bukan versi 6.7.1: $isccVersion" }

      - name: Restore full solution
        run: dotnet restore AlIkhsanMedia.Drone.sln

      - name: Build Release including WPF
        run: dotnet build AlIkhsanMedia.Drone.sln --configuration Release --no-restore -bl:artifacts/diagnostics/release-build.binlog

      - name: Run complete Windows test gate
        run: dotnet test AlIkhsanMedia.Drone.sln --configuration Release --no-build --logger "trx;LogFilePrefix=release-windows" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Build self-contained x64 installer
        shell: pwsh
        run: ./eng/package.ps1 -Version '${{ steps.version.outputs.tag }}' -Configuration Release

      - name: Generate Indonesian release notes
        shell: pwsh
        run: ./eng/new-release-notes.ps1 -Version '${{ steps.version.outputs.tag }}' -Destination artifacts/release/RELEASE_NOTES.md

      - name: Validate release assets
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $required = @("artifacts/release/AlIkhsanMedia-DroneVersion-Setup-$tag.exe", 'artifacts/release/SHA256SUMS.txt', 'artifacts/release/THIRD_PARTY_NOTICES.md', 'artifacts/release/RELEASE_NOTES.md')
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Release asset tidak ditemukan: $file" } }
          Push-Location artifacts/release
          $line = Get-Content SHA256SUMS.txt -Raw
          if ($line -notmatch '^(?<hash>[a-f0-9]{64})  (?<file>.+\.exe)\s*$') { throw 'Format SHA256SUMS.txt tidak valid.' }
          if ((Get-FileHash $Matches.file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches.hash) { throw 'Checksum installer tidak cocok.' }
          Pop-Location

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/diagnostics/**
            **/runtime/*.log

      - name: Stage release assets for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/release/AlIkhsanMedia-DroneVersion-Setup-${{ steps.version.outputs.tag }}.exe
            artifacts/release/SHA256SUMS.txt
            artifacts/release/THIRD_PARTY_NOTICES.md
            artifacts/release/RELEASE_NOTES.md

  publish-github-release:
    needs: build-test-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download validated assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ needs.build-test-package.outputs.tag }}
          path: release-assets

      - name: Create GitHub Release with GITHUB_TOKEN
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.build-test-package.outputs.tag }}'
          $arguments = @('release', 'create', $tag, "release-assets/AlIkhsanMedia-DroneVersion-Setup-$tag.exe", 'release-assets/SHA256SUMS.txt', 'release-assets/THIRD_PARTY_NOTICES.md', '--repo', '${{ github.repository }}', '--title', "Al Ikhsan Media (Drone Version) $tag", '--notes-file', 'release-assets/RELEASE_NOTES.md')
          if ('${{ github.event_name }}' -eq 'push') { $arguments += '--verify-tag' } else { $arguments += @('--target', '${{ github.sha }}') }
          if ('${{ needs.build-test-package.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Pembuatan GitHub Release gagal.' }
